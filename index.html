<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Marketplaces - Loja da Vivi</title>
<style>
:root{--bg:#fdf2f8;--surface:#fff;--text:#4a1d33;--muted:#a06b87;--border:#e5c9d9;--primary:#db2777;--primary-dark:#be185d;--primary-light:#fce7f3;--accent:#f472b6;--ok:#10b981;--danger:#ef4444;--shadow:0 4px 20px rgba(219,39,119,.10)}
.dark-mode{--bg:#1c2330;--surface:#232b39;--text:#eef1f6;--muted:#9aa7bd;--border:#3d4a63;--primary:#f472b6;--primary-dark:#ec4899;--primary-light:#3a2b45;--accent:#f9a8d4;--ok:#34d399;--danger:#f87171;--shadow:0 4px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1150px;margin:0 auto;padding:24px;padding-bottom:90px}
.app-header{background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:16px;padding:28px 32px;color:#fff;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.app-header::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(255,255,255,.12);border-radius:50%}
.mascot{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.header-text{flex:1;position:relative;z-index:2}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:.72rem;opacity:.9;margin:0}
.app-header h1{margin:6px 0 4px;font-size:1.7rem}
.subtitle{margin:0;opacity:.92;font-size:.92rem}
.updated-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:999px;font-size:.76rem;font-weight:600;backdrop-filter:blur(4px)}
.updated-badge .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3)}
.header-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:2}
.btn{padding:8px 14px;border:none;border-radius:10px;font-size:.85rem;cursor:pointer;font-weight:600;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(4px)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-top:20px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 4px;font-size:1.15rem}
.panel-sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.controls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600}
.field input,.field select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:.95rem;font-weight:400;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.money-input-wrap{display:flex;align-items:center;gap:6px}
.money-input-wrap span{color:var(--muted);font-weight:600}
.calc-feedback{font-size:.85rem;color:var(--muted);margin:16px 0 0;padding:10px 14px;border-radius:8px;background:var(--bg);min-height:20px}
.calc-feedback[data-state="success"]{color:var(--ok);background:rgba(16,185,129,.1)}
.calc-feedback[data-state="error"]{color:var(--danger);background:rgba(239,68,68,.1)}
.aliq-info{font-size:.85rem;color:var(--primary-dark);margin:12px 0 0;padding:10px 14px;border-radius:8px;background:var(--primary-light);font-weight:600}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.mode-card{border:1px solid var(--border);border-radius:14px;padding:18px;background:var(--surface);transition:box-shadow .2s,transform .2s}
.mode-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.mode-card h3{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:8px}
.mode-card p{color:var(--muted);font-size:.82rem;margin:0 0 14px}
.mode-badge{width:8px;height:8px;border-radius:50%;display:inline-block}
.mode-badge.manual{background:var(--primary)}
.mode-badge.vl{background:var(--ok)}
.mode-badge.pct{background:#f59e0b}
.mode-pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode-pill{padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:.8rem;font-weight:600;transition:all .15s}
.mode-pill.on-manual{background:#fff;border-color:#fff;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.mode-pill.on-vl{background:#10b981;border-color:#10b981;color:#fff}
.mode-pill.on-pct{background:#f59e0b;border-color:#f59e0b;color:#fff}
.dark-mode .mode-pill.on-manual{background:#eef1f6;border-color:#eef1f6;color:#1c2330}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
.results-table{width:100%;border-collapse:collapse;table-layout:fixed}
.results-table th,.results-table td{padding:10px 12px;font-size:.88rem;border:1px solid var(--border);text-align:center;overflow:hidden;text-overflow:ellipsis}
.results-table thead th{background:var(--bg);color:var(--muted);font-weight:700;text-transform:uppercase;font-size:.7rem;letter-spacing:.5px;padding-top:13px;padding-bottom:13px}
.results-table thead th:first-child{text-align:left}
.results-table tbody tr:nth-child(even){background:rgba(124,58,237,.03)}
.results-table tbody tr:hover{background:var(--primary-light)}
.results-table .marketplace-cell{font-weight:600;text-align:left;white-space:nowrap}
.results-table .result-cell{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.app-footer{margin-top:28px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;color:var(--muted);font-size:.82rem;text-align:center;margin-bottom:70px}
.footer-kicker{text-transform:uppercase;letter-spacing:2px;font-size:.68rem;margin:0;color:var(--primary);font-weight:600}
.footer-title{margin:4px 0;font-weight:700;color:var(--text)}
.footer-text{margin:0}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;gap:8px;padding:10px 16px;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:.72rem;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.nav-item:hover{background:var(--primary-light);color:var(--primary)}
.nav-item.is-active{color:var(--primary);font-weight:600}
.nav-item .nav-icon{font-size:1.1rem}
</style>
</head>
